<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1584px;height:396px;overflow:hidden;background:#0a0a0a}
.c{position:relative;width:1584px;height:396px;
  background:radial-gradient(ellipse 60% 120% at 78% 50%,#1c1708 0%,#0f0f0f 45%,#0a0a0a 100%)}
.grid{position:absolute;inset:0;
  background-image:linear-gradient(rgba(212,175,55,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(212,175,55,.05) 1px,transparent 1px);
  background-size:44px 44px;
  mask-image:linear-gradient(90deg,#000 0%,rgba(0,0,0,.35) 70%,rgba(0,0,0,.15) 100%)}
svg.net{position:absolute;inset:0}
.rack{position:absolute;left:560px;top:78px;width:150px}
.u{height:26px;margin-bottom:8px;border:1px solid rgba(212,175,55,.45);border-radius:3px;background:linear-gradient(180deg,#171717,#0d0d0d);
  display:flex;align-items:center;padding:0 10px;gap:6px}
.led{width:6px;height:6px;border-radius:50%;background:#D4AF37;box-shadow:0 0 8px #D4AF37}
.led.dim{background:#5a4a14;box-shadow:none}
.bay{flex:1;height:8px;border-radius:1px;background:repeating-linear-gradient(90deg,rgba(212,175,55,.35) 0 2px,transparent 2px 5px)}
.text{position:absolute;right:88px;top:50%;transform:translateY(-50%);text-align:right;width:760px}
.kicker{font:500 15px/1 'JetBrains Mono',monospace;color:#a0a0a0;letter-spacing:.5px;margin-bottom:18px}
.kicker b{color:#D4AF37;font-weight:500}
h1{font:700 50px/1.05 'Playfair Display',serif;color:#fff;letter-spacing:.3px}
h2{font:600 30px/1.2 'Inter',sans-serif;margin-top:12px;
  background:linear-gradient(90deg,#B8860B,#D4AF37 40%,#f3dc8a 60%,#D4AF37);-webkit-background-clip:text;color:transparent}
.rule{height:2px;width:320px;margin:22px 0 18px auto;background:linear-gradient(90deg,transparent,#D4AF37)}
.tags{font:400 16px/1 'Inter',sans-serif;color:#c0c0c0;letter-spacing:.4px}
.tags span{color:#D4AF37;margin:0 12px}
.edge{position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,transparent,#8B4513 20%,#D4AF37 60%,#B8860B)}
